name: Deploy Next.js site to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  issues: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        id: install
        shell: bash
        run: |
          set -o pipefail
          npm ci 2>&1 | tee install.log

      - name: Build with Next.js
        id: build
        shell: bash
        run: |
          set -o pipefail
          npm run build 2>&1 | tee build.log

      - name: Report app build failure
        if: failure() && (steps.install.outcome == 'failure' || steps.build.outcome == 'failure')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          {
            echo "## Automated deployment diagnostic"
            echo
            echo "Commit: $GITHUB_SHA"
            echo "Run: https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo
            if [ -f install.log ]; then
              echo "### npm install"
              echo '```text'
              tail -n 120 install.log
              echo '```'
            fi
            if [ -f build.log ]; then
              echo "### npm run build"
              echo '```text'
              tail -n 160 build.log
              echo '```'
            fi
          } > deploy-failure.md
          gh issue create --title "[deploy-debug] GitHub Pages app build failed" --body-file deploy-failure.md || true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  diagnose-build:
    if: always()
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Report unexpected build job failure
        if: needs.build.result != 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_RESULT: ${{ needs.build.result }}
        shell: bash
        run: |
          {
            echo "## GitHub Pages build job failed"
            echo
            echo "Build result: $BUILD_RESULT"
            echo "Commit: $GITHUB_SHA"
            echo "Run: https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          } > build-job-failure.md
          gh issue create --title "[deploy-debug] Pages build job failed" --body-file build-job-failure.md || true

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

      - name: Report deployment failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh run view "$GITHUB_RUN_ID" --log-failed > failed-run.log 2>&1 || true
          {
            echo "## GitHub Pages deployment failed"
            echo
            echo "Commit: $GITHUB_SHA"
            echo "Run: https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo
            echo "### Failed run log"
            echo '```text'
            tail -n 180 failed-run.log
            echo '```'
          } > deploy-result.md
          gh issue create --title "[deploy-debug] GitHub Pages deploy failed" --body-file deploy-result.md || true
