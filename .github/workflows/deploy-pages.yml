name: Deploy Next.js site to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  issues: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Install dependencies
        id: install
        shell: bash
        run: |
          set -o pipefail
          npm install 2>&1 | tee install.log

      - name: Build with Next.js
        id: build
        shell: bash
        run: |
          set -o pipefail
          npm run build 2>&1 | tee build.log

      - name: Report build failure
        if: failure() && (steps.install.outcome == 'failure' || steps.build.outcome == 'failure')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          {
            echo "## Automated deployment diagnostic"
            echo
            echo "Commit: $GITHUB_SHA"
            echo
            if [ -f install.log ]; then
              echo "### npm install"
              echo '```text'
              tail -n 120 install.log
              echo '```'
            fi
            if [ -f build.log ]; then
              echo "### npm run build"
              echo '```text'
              tail -n 160 build.log
              echo '```'
            fi
          } > deploy-failure.md
          gh issue create --title "[deploy-debug] GitHub Pages build failed" --body-file deploy-failure.md || true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
